name: Solution tags

# Creates the reference-solution tags (lesson-X.Y, part-N) listed in
# scripts/solution-tags.sh on the commits of the `solution` branch.
# Runs when the list changes on main, so the tags land with the docs that use them.
on:
  push:
    branches: [main]
    paths: ["scripts/solution-tags.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin solution --tags
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: sh scripts/solution-tags.sh
      - run: git push origin --tags
