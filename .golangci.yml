version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
    - testpackage
    - wrapcheck
  settings:
    wrapcheck:
      # Domain errors are the application's own vocabulary and already name
      # their context ("venue: invalid row"); wrapping them everywhere is noise.
      # Handlers still add the use case name at their boundary.
      ignore-package-globs:
        - github.com/williamokano/go-ddd-by-example/internal/*/domain
        - github.com/williamokano/go-ddd-by-example/internal/sharedkernel
  exclusions:
    rules:
      # The domain returns its own sentinel errors; there is nothing foreign to wrap.
      - path: internal/.*/domain/
        linters: [wrapcheck]
      # Test doubles pass errors through on purpose; tests are no error boundary.
      - path: _test\.go
        linters: [wrapcheck]
      # domain.DomainEvent is the ubiquitous language (it becomes
      # sharedkernel.DomainEvent in Part 7), not an accidental stutter.
      - path: internal/.*/domain/
        linters: [revive]
        text: "stutters"

formatters:
  enable:
    - gofmt
    - goimports
