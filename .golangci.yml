version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
    - testpackage
    - wrapcheck
  exclusions:
    rules:
      # The domain returns its own sentinel errors; there is nothing foreign to wrap.
      - path: internal/.*/domain/
        linters: [wrapcheck]
      # domain.DomainEvent is the ubiquitous language (it becomes
      # sharedkernel.DomainEvent in Part 7), not an accidental stutter.
      - path: internal/.*/domain/
        linters: [revive]
        text: "stutters"

formatters:
  enable:
    - gofmt
    - goimports
