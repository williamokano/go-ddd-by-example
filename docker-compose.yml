services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: stagehand
      POSTGRES_PASSWORD: stagehand
      POSTGRES_DB: stagehand
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagehand"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql]

  kafka:
    image: apache/kafka:4.1.0            # KRaft mode, no ZooKeeper
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are architecture: declared in kafka-init
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      retries: 30

  kafka-init:                           # one-shot: creates the topics (and their DLQs), then exits
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        for t in venue.events show.events ticketing.events ticketing.internal; do
          for topic in $$t $$t.dlq; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 3
          done
        done

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  migrate:                              # one-shot: same image as the app, different subcommand
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://stagehand:stagehand@postgres:5432/stagehand?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: .
    command: ["serve"]
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://stagehand:stagehand@postgres:5432/stagehand?sslmode=disable
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/stagehand", "healthcheck"]
      interval: 2s
      retries: 30

volumes:
  pgdata: {}
