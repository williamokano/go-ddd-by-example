version: "2"
sql:
  - engine: postgresql
    schema: db/migrations                 # sqlc understands goose's Up/Down annotations
    queries: db/queries/venue
    gen:
      go:
        package: sqlcgen
        out: internal/venue/adapters/driven/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/show
    gen:
      go:
        package: sqlcgen
        out: internal/show/adapters/driven/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
